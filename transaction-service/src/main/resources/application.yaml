spring:
  application:
    name: trasanction-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/transacction_db?createDatabaseIfNotExist=true
    username: root
    password: root

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

kafka:
  boostrap-servers: localhost:9092
  consumer:
    group-id: account-service-group
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring:
        json:
          trusted:
            packages: "*"
            use:
              type:
                headers: false
                value:
                  default: type:java.util.HashMap
producer:
  key-serializer: org.apache.kafka.common.serialization.StringSerializer
  value-serializer: org.springframework.kafka.support.serializer.KsonSerializer

account:
  service:
    url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info


